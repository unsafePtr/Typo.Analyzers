name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# A new push to a pull request cancels its run in flight. On main a running build finishes, and only the newest queued run follows it.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  # Match the local-dev guidance — same MSBuild server reuse on CI for faster reruns.
  MSBUILDUSESERVER: '1'
  # Quiet down telemetry / first-run noise.
  DOTNET_CLI_TELEMETRY_OPTOUT: '1'
  DOTNET_NOLOGO: '1'
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: '1'

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        # Ubuntu is named explicitly so a runner image move is a reviewed change, not a silent one.
        os: [ubuntu-26.04, windows-latest]
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v7

      - name: Setup .NET (from global.json)
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Show .NET info
        run: dotnet --info

      # Package versions live in Directory.Packages.props, so it is part of the key.
      - name: Cache NuGet packages
        uses: actions/cache@v6
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('**/*.csproj', 'Directory.Packages.props', 'global.json') }}
          restore-keys: |
            nuget-${{ runner.os }}-

      - name: Restore
        run: dotnet restore

      - name: Build
        run: dotnet build -v:q --no-restore

      - name: Verify formatting
        run: dotnet format --verify-no-changes --no-restore

      # xUnit v3 + Microsoft.Testing.Platform — `dotnet run` is the canonical runner.
      - name: Test
        run: dotnet run --project tests/Typo.Tests/Typo.Tests.csproj --no-build
